<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Post</title>
</head>
<body>
    <a href="/">&larr; Back to Feed</a>
    <h2>Create New Blog Post</h2>
    {{if .Error}}<p style="color: red;">{{.Error}}</p>{{end}}

    <form method="POST" action="/posts" enctype="multipart/form-data">
        <div>
            <label>Title:</label><br>
            <input type="text" name="title" style="width: 300px;" required>
        </div><br>
        <div>
            <label>Content:</label><br>
            <textarea name="content" rows="6" cols="45" required></textarea>
        </div><br>
        <div>
            <label>Image (optional):</label><br>
            <input type="file" name="image" accept="image/*">
        </div><br>
        <div>
            <label>
                <input type="checkbox" name="is_private" value="true" onchange="document.getElementById('shares-box').style.display = this.checked ? 'block' : 'none';">
                Make this post Private
            </label>
        </div><br>
        <div id="shares-box" style="display: none;">
            <label>Share with (comma-separated usernames):</label><br>
            <input type="text" name="shared_users" placeholder="alice, bob" style="width: 300px;">
        </div><br>
        <button type="submit">Publish Post</button>
    </form>
</body>
</html>
