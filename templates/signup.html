<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weblog - Signup</title>
</head>
<body>
    <h2>Signup</h2>
    {{if .Error}}<p style="color: red;">{{.Error}}</p>{{end}}
    <form method="POST" action="/signup">
        <div><label>Username:</label><input type="text" name="username" required></div><br>
        <div><label>Password:</label><input type="password" name="password" required></div><br>
        <button type="submit">Signup</button>
    </form>
    <p>Already have an account? <a href="/login">Login</a></p>
</body>
</html>
